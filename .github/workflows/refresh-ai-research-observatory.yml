name: Refresh AI Research Observatory

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Recent years or backfill every catalog year from 2020"
        type: choice
        required: true
        default: recent
        options:
          - recent
          - backfill-2020

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ingestion logic
        run: python3 -m unittest discover -s scripts -p 'test_ai_research*.py'
      - name: Test dashboard calculations
        run: node scripts/test_ai_research_observatory_core.cjs
      - name: Refresh AI research snapshot
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_SCOPE: ${{ inputs.refresh_scope || 'recent' }}
        run: |
          if [ "$REFRESH_SCOPE" = "backfill-2020" ]; then
            if [ -z "$OPENALEX_API_KEY" ]; then
              echo "OPENALEX_API_KEY is required for historical backfill" >&2
              exit 1
            fi
            python3 scripts/refresh_ai_research_observatory.py --from-year 2020 --github-cap 250
          elif [ -n "$OPENALEX_API_KEY" ]; then
            python3 scripts/refresh_ai_research_observatory.py --github-cap 250
          else
            echo "No OPENALEX_API_KEY; refreshing official proceedings and GitHub evidence only"
            python3 scripts/refresh_ai_research_observatory.py --skip-openalex --github-cap 250
          fi
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.136.5"
          extended: true
      - name: Validate site
        run: |
          ./scripts/check_posts_have_tags.sh
          python3 ./scripts/sync_llm_pricing_data.py
          hugo --minify --cleanDestinationDir
          ./scripts/check_internal_links.sh public
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- static/data/ai-research-observatory.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/ai-research-observatory.json
          git commit -m "Refresh AI research observatory snapshot"
          git pull --rebase origin master
          git push origin master
